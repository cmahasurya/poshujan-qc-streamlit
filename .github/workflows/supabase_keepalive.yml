name: Supabase Daily Keep-Alive

on:
  schedule:
    # 00:00 UTC = 08:00 WITA (Runs every morning)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  supabase-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        id: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase returned HTTP Status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "STATUS_CODE=${HTTP_STATUS}" >> $GITHUB_ENV
            exit 1
          fi

      - name: Send Telegram Alert on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_CODE: ${{ env.STATUS_CODE }}
        run: |
          MESSAGE="⚠️ *Supabase Keep-Alive Failed!*%0A%0A• *Repo:* ${{ github.repository }}%0A• *Status Code:* ${STATUS_CODE:-'Unreachable / Network Error'}%0A• *Time:* $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
